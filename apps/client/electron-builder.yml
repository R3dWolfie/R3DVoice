appId: com.r3dwolfie.r3dvoice
productName: R3DVoice
copyright: Copyright © 2026 R3dWolfie

protocols:
  - name: R3DVoice
    schemes:
      - r3dvoice
      # Legacy pre-rename scheme — old invite links in chats keep working.
      - redvoice

directories:
  output: release
  buildResources: build

files:
  - "out/**/*"
  - "package.json"

asar: true

# Native modules with prebuilt .node binaries can't load from inside an
# asar archive; electron-builder unpacks them next to the asar so require()
# can resolve them at runtime.
asarUnpack:
  - "**/node_modules/@vencord/venmic/**"

linux:
  target:
    - AppImage
    - deb
  category: Network
  # Point at directory of multi-size PNGs so the AppImage bundles
  # 32/48/64/128/256/512/1024 — desktop-integration's findAppIcon walks these.
  icon: build/icons
  # Stable filename across versions: electron-updater replaces the file in
  # place after download, so the user's shortcut keeps pointing at the right
  # path forever. Version is still in latest-linux.yml + the release tag.
  artifactName: ${productName}.${ext}
  # Override the executable name away from the sanitized package name
  # (@r3dvoiceclient). Affects WMClass matching + .desktop lookups.
  executableName: r3dvoice
  desktop:
    entry:
      Name: R3DVoice
      Comment: Open-source screenshare + voice chat
      Categories: Network;Chat;AudioVideo;
      StartupWMClass: R3DVoice
      MimeType: x-scheme-handler/r3dvoice;

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-Setup.${ext}
  extraResources:
    # Native WASAPI process-loopback helper. Built by .github/workflows/release.yml
    # and staged at build/native/ before electron-builder runs. Main process spawns
    # this binary to capture system audio while EXCLUDING the R3DVoice process tree
    # (so screenshare audio doesn't include voices we're playing back from the call).
    - from: build/native/system-audio-capture.exe
      to: system-audio-capture.exe

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - dmg
  category: public.app-category.social-networking
  icon: build/icon.png
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}.${ext}

publish:
  provider: github
  owner: R3dWolfie
  repo: R3DVoice
  releaseType: release
