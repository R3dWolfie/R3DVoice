name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @r3dvoice/shared build

      - name: Generate Prisma client (server typecheck dep)
        run: pnpm --filter @r3dvoice/server exec prisma generate

      - name: Build server
        run: pnpm --filter @r3dvoice/server build

      - name: Setup MSBuild (Windows)
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2

      - name: Build native system-audio-capture helper (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: apps/client/native/system-audio-capture-win
        run: |
          nuget restore SystemAudioCapture.sln -PackagesDirectory packages
          msbuild SystemAudioCapture.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WarningLevel=2
          New-Item -ItemType Directory -Force -Path ../../build/native | Out-Null
          Copy-Item x64/Release/system-audio-capture.exe ../../build/native/system-audio-capture.exe -Force

      - name: Build client
        run: pnpm --filter @r3dvoice/client run build

      - name: Package + publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm --filter @r3dvoice/client exec electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package + publish (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @r3dvoice/client exec electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package + publish (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm --filter @r3dvoice/client exec electron-builder --mac dmg --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build the pacman package (.pkg.tar.zst) from our PKGBUILD, wrapping the
  # AppImage the build job just published. The desktop app's in-app auto-updater
  # downloads this and installs it with `pkexec pacman -U` (one password prompt).
  # Everything runs in one shell step inside an Arch container so no JS action
  # needs node in the container.
  arch-pkg:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Build + upload r3dvoice-bin pacman package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --needed base-devel git curl pacman-contrib sudo github-cli
          VER="${GITHUB_REF_NAME#v}"
          useradd -m builder
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/packaging/aur/r3dvoice-bin/PKGBUILD" -o /home/builder/PKGBUILD
          chown -R builder:builder /home/builder
          sudo -u builder bash -euc "
            cd /home/builder
            sed -i 's/^pkgver=.*/pkgver=${VER}/;s/^pkgrel=.*/pkgrel=1/' PKGBUILD
            updpkgsums PKGBUILD
            makepkg -f --noconfirm --skippgpcheck
          "
          cp /home/builder/r3dvoice-bin-*.pkg.tar.zst R3DVoice.pkg.tar.zst
          gh release upload "${GITHUB_REF_NAME}" R3DVoice.pkg.tar.zst --clobber -R "${GITHUB_REPOSITORY}"
